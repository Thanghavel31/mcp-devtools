spring.ai.mcp.server.name=cosmos-devtools-mcp-server
spring.ai.mcp.server.version=0.0.1
spring.ai.mcp.server.stdio=true
spring.main.web-application-type=none
spring.main.banner-mode=off
logging.file.name=hello-mcp.log
logging.level.root=OFF

# GitHub Personal Access Token (read from env variable, never hardcode)
# Generate a fine-grained read-only token at: https://github.com/settings/tokens
# Run with: GITHUB_TOKEN=ghp_xxx java -jar target/mcpServer-0.0.1-SNAPSHOT.jar
github.token=${GITHUB_TOKEN:}

# PostgreSQL connection (start with: docker compose up -d)
postgres.url=${POSTGRES_URL:jdbc:postgresql://localhost:5433/cosmos}
postgres.user=${POSTGRES_USER:cosmos_reader}
postgres.password=${POSTGRES_PASSWORD:cosmos_readonly_2026}
